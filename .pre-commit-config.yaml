minimum_pre_commit_version: "3.5.0"

default_stages: [pre-commit]
default_language_version:
  python: python3

# Keep hooks focused on this repository's editable sources. Vendored code,
# submission snapshots, datasets, checkpoints, and build artifacts are noisy
# under `pre-commit run --all-files` and should not be auto-formatted.
exclude: |
  (?x)^(
    \.idea/|
    \.vscode/|
    \.pytest_cache/|
    3rdparty/|
    csrc/core/include/yolov8/3rdparty/|
    submissions/|
    2026_cti_data/|
    dataset/|
    docker/cudnn-linux-.*|
    log/|
    pylibs/(flash_attn|hopper)/|
    custom_op_cpp_ext/(build|dist|custom_op\.egg-info)/|
    .*\.egg-info/|
    ckpt\.pt$|
    libraries\.tar$|
    tests/results/
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: debug-statements
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff
        name: ruff lint python
        args:
          - --fix
          - --exit-non-zero-on-fix
          - --line-length=120
          - --target-version=py310
          - --select=E9,F63,F7,F82,I,UP
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format python
        args:
          - --line-length=120
          - --target-version=py310
        types_or: [python, pyi]

  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.22
    hooks:
      - id: mdformat
        name: mdformat markdown
        additional_dependencies:
          - mdformat-frontmatter
          - mdformat-gfm
        files: ^(README\.md|CLAUDE\.md|docs/.*\.md|csrc/.*\.md|tests/(?!results/).*\.md)$
        types_or: [markdown]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v20.1.7
    hooks:
      - id: clang-format
        name: clang-format CUDA/C++
        files: ^(custom_op_cpp_ext/custom_op/csrc|csrc)/.*\.(c|cc|cpp|cu|cuh|h|hpp)$
        types_or: [c, c++, cuda]
